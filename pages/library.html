<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="铜运寻踪实践队影像资料库——按类型查看编号目录" />
  <title>影像资料库 | 铜运古道非遗文化数字化展示平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">铜运古道 · 非遗</a>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
      <nav class="nav" id="main-nav">
        <a href="../index.html#home">首页</a>
        <a href="../index.html#reports">调研报告</a>
        <a href="../index.html#oral">口述史</a>
        <a href="../index.html#videos">影像纪实</a>
        <a href="library.html" class="active">影像资料库</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="page-crumb"><a href="../index.html">首页</a> / 影像资料库</p>
        <p class="eyebrow">03 — LIBRARY</p>
        <h1>“铜运寻踪”影像资料库</h1>
        <p class="lead">按类别查看全部影像编号目录，支持分类筛选与搜索。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- 类型切换 -->
        <div class="filter-bar library-tabs" id="lib-tabs">
          <button class="filter-btn active" data-cat="古道图片">古道 · 图片</button>
          <button class="filter-btn" data-cat="古道视频">古道 · 视频</button>
          <button class="filter-btn" data-cat="非遗图片">非遗 · 图片</button>
          <button class="filter-btn" data-cat="非遗视频">非遗 · 视频</button>
          <button class="filter-btn" data-cat="会馆图片">会馆 · 图片</button>
        </div>

        <!-- 搜索 -->
        <div class="inp-row search-row">
          <input id="lib-search" type="search" placeholder="搜索编号 / 位置 / 传承人 / 会馆…" />
        </div>

        <!-- 统计 -->
        <p class="lib-count" id="lib-count"></p>

        <!-- 表格 -->
        <div class="table-wrap">
          <table class="lib-table" id="lib-table">
            <thead id="lib-thead"></thead>
            <tbody id="lib-tbody"></tbody>
          </table>
        </div>

        <div class="report-back">
          <a class="btn btn-ghost" href="../index.html">← 返回首页</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>铜运古道非遗文化数字化展示平台</strong>
        <p>项目结束后可移交会泽县文化馆，或提供独立访问链接长期维护。</p>
      </div>
      <div class="footer-links">
        <a href="../docs/网络维护手册.md">网络维护手册</a>
        <a href="../index.html#reports">报告下载</a>
        <a href="../index.html#videos">影像纪实</a>
      </div>
      <p class="copyright">静态站点 · 无后端依赖 · 便于归档移交</p>
    </div>
  </footer>

  <script src="../js/library-data.js"></script>
  <script src="../js/library.js"></script>
</body>
</html>
